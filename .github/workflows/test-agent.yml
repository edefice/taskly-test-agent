# The unit test agent on pull requests: analyze, baseline, up to three attempts (each one the
# agent, then the gate), commit, report. Each job has only the access it needs, and the API key
# reaches only the job that runs the agent. See scripts/ci/workflow-rules.mjs for what a test
# keeps true in this file.
#
# Tools always come from the base commit, so a pull request cannot change the checks it is
# judged by. A person with write access can still change this file in a pull request, because
# pull_request reads the workflow from the branch. SOLUTION.md describes this limit.
name: Unit test agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      report: ${{ steps.guard.outputs.report }}
      packages: ${{ steps.guard.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the tools from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: agent-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # When the base has no tools yet, every later job skips, and the run ends cleanly.
      - name: Decide whether the agent runs
        id: guard
        if: hashFiles('agent-tools/scripts/ci/analyze-pr.mjs') != ''
        env:
          ANALYSIS_OUT: ${{ runner.temp }}/analysis
        run: |
          mv agent-tools "$RUNNER_TEMP/tools"
          node "$RUNNER_TEMP/tools/scripts/ci/analyze-pr.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guard.outcome == 'success'
        with:
          name: analysis
          path: ${{ runner.temp }}/analysis
          retention-days: 30

  baseline:
    needs: analyze
    if: needs.analyze.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the tools from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: agent-tools
          persist-credentials: false
      - run: |
          mv agent-tools "$RUNNER_TEMP/tools"
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install the packages this change touches
        env:
          PACKAGES: ${{ needs.analyze.outputs.packages }}
        run: |
          for name in ${PACKAGES//,/ }; do
            npm --prefix "$name" ci
          done
      - name: Take the baseline
        id: baseline
        env:
          PACKAGES: ${{ needs.analyze.outputs.packages }}
          OUT: ${{ runner.temp }}/baseline
        run: |
          node "$TOOLS/.claude/skills/test-verification/scripts/verify-tests.mjs" baseline --out "$OUT/baseline.json" --packages "$PACKAGES"
          node "$TOOLS/scripts/ci/baseline-red.mjs" "$OUT"
      # A failure from here on leaves the result as not checked. It must not turn the check red.
      - name: Check out the base commit
        id: base
        if: steps.baseline.outputs.red == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-checkout
          persist-credentials: false
      - name: Compare red tests with the base commit
        if: steps.baseline.outputs.red == 'true' && steps.base.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGES: ${{ needs.analyze.outputs.packages }}
          OUT: ${{ runner.temp }}/baseline
        run: |
          mv base-checkout "$RUNNER_TEMP/base"
          for name in ${PACKAGES//,/ }; do
            npm --prefix "$RUNNER_TEMP/base/$name" ci
          done
          node "$TOOLS/.claude/skills/test-verification/scripts/check-regressions.mjs" --baseline "$OUT/baseline.json" --base-dir "$RUNNER_TEMP/base" --out "$OUT/regressions.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline
          retention-days: 30

  round-0:
    needs: [analyze, baseline]
    if: needs.analyze.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test-agent-round.yml
    with:
      round: 0
      packages: ${{ needs.analyze.outputs.packages }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  round-1:
    needs: [analyze, round-0]
    if: needs.round-0.outputs.next != ''
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test-agent-round.yml
    with:
      round: 1
      previous: 0
      packages: ${{ needs.analyze.outputs.packages }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  round-2:
    needs: [analyze, round-1]
    if: needs.round-1.outputs.next != ''
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test-agent-round.yml
    with:
      round: 2
      previous: 1
      packages: ${{ needs.analyze.outputs.packages }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  commit:
    needs: [round-0, round-1, round-2]
    # Not after the scan found the key: nothing from this run may be used then.
    if: >-
      !cancelled()
      && (needs.round-0.outputs.accepted == 'true' || needs.round-1.outputs.accepted == 'true' || needs.round-2.outputs.accepted == 'true')
      && needs.round-0.outputs.scan != 'found' && needs.round-1.outputs.scan != 'found' && needs.round-2.outputs.scan != 'found'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Credentials stay for the push. This job runs no code from the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out the tools from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: agent-tools
          persist-credentials: false
      - run: mv agent-tools "$RUNNER_TEMP/tools"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # By name, because without one the action puts a single match directly in path, and a run
      # with one round looks like a run with none. A missing name is an error, hence the conditions.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-0.outputs.accepted == 'true'
        with:
          name: gate-round-0
          path: ${{ runner.temp }}/artifacts/gate-round-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-1.outputs.accepted == 'true'
        with:
          name: gate-round-1
          path: ${{ runner.temp }}/artifacts/gate-round-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-2.outputs.accepted == 'true'
        with:
          name: gate-round-2
          path: ${{ runner.temp }}/artifacts/gate-round-2
      - name: Commit the accepted tests
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          OUT: ${{ runner.temp }}/commit
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/tools/scripts/ci/commit-tests.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit
          path: ${{ runner.temp }}/commit
          retention-days: 30

  report:
    needs: [analyze, baseline, round-0, round-1, round-2, commit]
    # Also after a failure, because a failure needs an explanation most of all.
    if: ${{ !cancelled() && needs.analyze.outputs.report != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out the tools from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: agent-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The conditions skip what never existed. A download that still fails must not stop the
      # report: the report says what is missing, and a job with no report explains nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.analyze.outputs.report != ''
        continue-on-error: true
        with:
          name: analysis
          path: ${{ runner.temp }}/artifacts/analysis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.baseline.result == 'success'
        continue-on-error: true
        with:
          name: baseline
          path: ${{ runner.temp }}/artifacts/baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-0.outputs.scan == 'clean'
        continue-on-error: true
        with:
          name: gate-round-0
          path: ${{ runner.temp }}/artifacts/gate-round-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-1.outputs.scan == 'clean'
        continue-on-error: true
        with:
          name: gate-round-1
          path: ${{ runner.temp }}/artifacts/gate-round-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round-2.outputs.scan == 'clean'
        continue-on-error: true
        with:
          name: gate-round-2
          path: ${{ runner.temp }}/artifacts/gate-round-2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.commit.result == 'success'
        continue-on-error: true
        with:
          name: commit
          path: ${{ runner.temp }}/artifacts/commit
      - name: Publish the report
        if: hashFiles('agent-tools/scripts/ci/publish-report.mjs') != ''
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          GITHUB_TOKEN: ${{ github.token }}
          SCAN_BLOCKED: ${{ needs.round-0.outputs.scan == 'found' || needs.round-1.outputs.scan == 'found' || needs.round-2.outputs.scan == 'found' }}
        run: node agent-tools/scripts/ci/publish-report.mjs
